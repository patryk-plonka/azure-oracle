name: Pull Request Quality

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: uv run ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: uv run mypy .

  tests:
    name: PostgreSQL tests and coverage
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: azlimits_test
          POSTGRES_USER: azlimits_test
          POSTGRES_PASSWORD: azlimits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azlimits_test -d azlimits_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://azlimits_test:azlimits_test@localhost:5432/azlimits_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/ -v --cov --cov-branch --cov-report=term-missing
