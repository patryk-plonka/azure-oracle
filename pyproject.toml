[project]
name = "azure-oracle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.139.2",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
files = ["."]
explicit_package_bases = true
