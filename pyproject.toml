[project]
name = "azure-oracle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.139.2",
    "httpx>=0.27.0",
    "mcp>=2,<3",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
azlimits-onboard = "onboarding_cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["onboarding_cli", "schemas"]

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
files = ["."]
explicit_package_bases = true
